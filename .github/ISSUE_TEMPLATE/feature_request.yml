name: Feature request
description: Propose a change to what Genesis does
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Genesis to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try or consider instead?
