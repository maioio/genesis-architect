name: Bug report
description: Genesis did something wrong or crashed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys or private code. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command and the output you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Which entry point?
      options:
        - genesis init
        - genesis recover
        - Another command
        - MCP tools
        - Agent skill (Claude Code, Cursor, Codex)
        - Documentation site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `genesis --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and operating system
    validations:
      required: true
