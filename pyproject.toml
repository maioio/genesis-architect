[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-architect-pro"
version = "5.4.1"
description = "Genesis Architect Pro - multi-source research, pitfall ranking, video-to-pitfall, and cross-session memory. Requires a license."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genesis-architect>=5.4.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
