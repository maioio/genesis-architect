name: VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:

jobs:
  package:
    name: Package .vsix
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: companion/vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: companion/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package .vsix
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-companion-vsix
          path: companion/vscode-extension/*.vsix
          retention-days: 30

      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish -- -p "$VSCE_PAT"
