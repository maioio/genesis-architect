name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Auto-provisioning shells out to pip and mutates the environment. CI must be
# reproducible, so it is disabled everywhere in this workflow.
env:
  GENESIS_NO_AUTO_INSTALL: '1'

jobs:
  quality-gates:
    name: Quality Gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match the requires-python range and classifiers in pyproject.toml.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]" -q

      - name: Phase 0 env probe (self-check)
        run: python scripts/env_probe.py --self-check

      - name: Run unit tests with coverage
        # Coverage targets the installed package. It previously pointed at
        # scripts/, which reported almost nothing about the real codebase.
        run: python -m pytest tests/ -q --tb=short --cov=src/genesis_architect --cov-report=xml:coverage.xml

      - name: Run research validator on example
        run: python scripts/research_validator.py examples/typescript-cli/RESEARCH.md

      - name: Run research validator (live citation check)
        # --issues-only skips RESEARCH.md section checks (not applicable to PITFALLS.md).
        # Returns success on transient network errors; only a real 404 fails this step.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/research_validator.py examples/typescript-cli/PITFALLS.md --verify-issues --issues-only

      - name: Run research validator on template
        run: python scripts/research_validator.py assets/RESEARCH.template.md

      - name: Validate eval schema
        run: python scripts/eval_runner.py --mode validate

      - name: Run eval runner
        run: python scripts/eval_runner.py --mode report

      - name: Scaffold smoke test (all 8 language/tier combos)
        # Raises NotImplementedError on any unhandled filename - catches stub regressions.
        run: |
          set -e
          for lang in python typescript go rust; do
            for tier in minimalist scalable; do
              out="/tmp/scaffold-$lang-$tier"
              python scripts/scaffold_generator.py --language "$lang" --tier "$tier" --name "smoke" --output "$out"
            done
          done
          test -f /tmp/scaffold-python-minimalist/pyproject.toml
          test -f /tmp/scaffold-python-minimalist/src/smoke/__init__.py
          test -f /tmp/scaffold-typescript-minimalist/.github/workflows/ci.yml
          test -f /tmp/scaffold-rust-scalable/src/config.rs
          echo "Scaffold smoke test passed for all 8 combos"

      - name: Run pitfall coverage check on example
        run: python scripts/pitfall_coverage_check.py examples/python-cli/PITFALLS.md examples/python-cli/src/ --check-platform-risks

      - name: Genesis evidence pack (example)
        # Generates ARCHITECTURE_EVIDENCE.md + .genesis/evidence.json from the example project.
        # Fails if RESEARCH.md/PITFALLS.md/ROADMAP.md are missing or contain only template text.
        run: python scripts/evidence_pack.py generate --project-dir examples/python-cli/

      - name: Genesis mitigation enforcement on example
        # Hard check: every mitigation_file_path in PITFALLS.md must exist and contain real code.
        # --allow-unmapped: pitfalls without mitigation_file_path (e.g. config-file mitigations) are
        # reported as warnings but do not fail the build. Only missing or stub-only files fail.
        run: |
          python scripts/mitigation_enforcer.py \
            examples/python-cli/PITFALLS.md \
            --src-root examples/python-cli/ \
            --allow-unmapped

      - name: Run drift detector on example (Level 2)
        # Level 2: structural drift + AST import boundary violations.
        # .genesis/evidence.json is generated by the evidence pack step above.
        # Exits 0 if no structural drift and no forbidden imports detected.
        run: python scripts/drift_detector.py examples/python-cli/ --level 2 --json

      - name: Genesis state machine smoke test
        # Verifies genesis_state.py write+require cycle works correctly.
        # Tests: write-phase2 records state, require-phase2 reads it back (exit 0).
        # If require-phase2 exits 1, the state machine is broken.
        run: |
          python scripts/genesis_state.py write-phase2 /tmp/genesis-state-test \
            --repo-count 12 --deep-count 5
          python scripts/genesis_state.py require-phase2 /tmp/genesis-state-test
          python scripts/genesis_state.py write-phase3-validation /tmp/genesis-state-test --urls-checked 5
          python scripts/genesis_state.py require-phase3-validation /tmp/genesis-state-test
          echo "genesis_state.py: write+require cycle OK"

      - name: Verify own evidence pack (dogfooding)
        # Genesis Architect generates its own ARCHITECTURE_EVIDENCE.md from SELF_RESEARCH.md.
        # This proves the toolchain works on a real project (itself).
        run: |
          python scripts/evidence_pack.py generate \
            --project-dir . \
            --research-path SELF_RESEARCH.md \
            --pitfalls-path SELF_PITFALLS.md \
            --roadmap-path SELF_ROADMAP.md
          python scripts/mitigation_enforcer.py SELF_PITFALLS.md --src-root .

      - name: Check SKILL.md constraints
        run: |
          lines=$(wc -l < SKILL.md)
          echo "SKILL.md lines: $lines"
          if [ "$lines" -gt 400 ]; then echo "FAIL: over 400 lines"; exit 1; fi
          if LC_ALL=C.UTF-8 grep -P '\x{2014}|\x{2013}' SKILL.md; then echo "FAIL: em dashes found in SKILL.md"; exit 1; fi
          echo "SKILL.md constraints OK"

      - name: Check no em dashes in reader-facing docs
        # Scoped deliberately to the prose a visitor actually reads. Source
        # comments are exempt: en dashes are correct in numeric ranges there
        # (confidence: 0.0-1.0), and rewriting ~2000 of them would churn code
        # for no reader-facing gain. Historical files (CHANGELOG, release
        # notes) are frozen records and are not rewritten.
        # The pattern uses explicit codepoints and forces a UTF-8 locale. A
        # literal [—–] class degrades to a *byte* class when LANG is unset (as
        # in a bare container) and then matches box-drawing characters, so any
        # ASCII-art directory tree would fail this check.
        #
        # Scope is the hand-written Markdown only. docs/ is deliberately NOT
        # included: it is the built site (a minified React bundle, images and
        # generated demo pages), so scanning it flags compiled output and
        # binaries. The site's prose lives in the separate genesis-react repo.
        run: |
          found=$(LC_ALL=C.UTF-8 grep -rnP '\x{2014}|\x{2013}' \
            README.md SKILL.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md \
            2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "FAIL: em/en dashes found in reader-facing docs:"
            echo "$found"
            exit 1
          fi
          echo "OK: no em dashes in reader-facing docs"

  # Branch protection on main requires a check named exactly "Quality Gates".
  # The matrix above reports as "Quality Gates (py3.11)" and friends, which
  # never matches, so without this aggregate the PR stays blocked forever.
  # It also means adding a Python version later does not require touching
  # branch protection.
  quality-gates-summary:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: quality-gates
    if: always()
    steps:
      - name: Fail if any matrix job did not succeed
        run: |
          result="${{ needs.quality-gates.result }}"
          echo "matrix result: $result"
          [ "$result" = "success" ] || exit 1

  # Named "Tests" to match the required check on main. That is not a fudge:
  # this job runs the full suite (2295 tests) plus the CLI smoke tests against
  # a real install, and then the wheel acceptance test. It is the most
  # authoritative test signal in the repo, not a subset.
  packaged-install:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the suite plus end-to-end CLI checks against a real `pip install`
      # rather than the source checkout. This is what catches packaging bugs
      # that are invisible from the repo: data files that never made it into
      # the wheel, entry points that do not resolve, imports that only work
      # because the repo root happens to be on sys.path.
      - name: Build test image
        run: docker build -f Dockerfile.test -t genesis-test .

      - name: Suite + CLI smoke tests on the installed package
        run: docker run --rm genesis-test

      # Dockerfile.test installs with `pip install -e`, which leaves the repo
      # on sys.path and masks missing package data. This builds the wheel and
      # installs it into a clean image with no source tree, so it fails if the
      # artifact users actually download is broken.
      - name: Build wheel acceptance image
        run: docker build -f Dockerfile.wheel -t genesis-wheel .

      - name: Acceptance test on the built wheel
        run: docker run --rm genesis-wheel

  build-artifacts:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          pip install -q build twine
          python -m build

      - name: Check metadata renders on PyPI
        run: twine check dist/*

      - name: Verify package data is actually in the wheel
        # Regression guard: the scaffold layout catalog is read at import time,
        # so if it stops shipping the installed package breaks on import.
        run: |
          set -e
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          required = [
              "genesis_architect/core/data/folder-structures.toml",
              "genesis_architect/pro/data/research_sources.json",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print("FAIL: missing from wheel:", missing)
              sys.exit(1)
          print("OK: required package data present in wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Name must stay exactly "Secret Scanning": it is a required check on main.
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: Static Analysis (SonarCloud)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate coverage report
        run: |
          pip install -e ".[dev]" -q
          python -m pytest tests/ -q --cov=scripts --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=false

  security-scan:
    name: Dependency Security (Snyk)
    runs-on: ubuntu-latest
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]" -q

      - name: Run Snyk scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-python.sarif

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-python.sarif
        continue-on-error: true
