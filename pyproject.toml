[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-architect-pro"
version = "6.6.0"
description = "Genesis Architect Pro - architecture analysis, anti-pattern detection, security hardening, C4 diagrams, deep research intelligence, a decision engine for every mode, and a voice-capable IDE-aware Companion. Requires a license."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genesis-architect>=5.4.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pytest-cov>=5"]
tui = ["rich>=13"]
companion = ["plyer>=2.1"]
# Companion App optional subsystems — code degrades gracefully without these,
# and prints the matching `pip install genesis-architect-pro[<extra>]` hint.
streaming = ["websockets>=12"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
committee = ["anthropic>=0.40"]
# Everything for the full desktop Companion experience.
companion-full = [
    "plyer>=2.1", "rich>=13", "websockets>=12",
    "faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "anthropic>=0.40",
]

[project.scripts]
genesis = "genesis_architect_pro.gde_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genesis_architect_pro = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
