name: Documentation
description: Something in the docs, README or website is wrong, missing or unclear
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: Page URL or file path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
