name: Genesis Sync — Autonomous Maintenance

on:
  schedule:
    # Every Sunday at 02:03 UTC (off-peak, not :00 to reduce API congestion)
    - cron: '3 2 * * 0'
  # Allow manual trigger from the Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (analyse only, no writes)'
        type: boolean
        default: false

permissions:
  contents: write        # write .genesis/ files back to repo
  pull-requests: write   # open a PR for yellow-zone findings
  issues: write          # open an issue on red-zone block

jobs:
  genesis-sync:
    name: Genesis Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git_analyzer churn metrics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install genesis-architect-pro
        run: pip install -e ".[pro]" --quiet

      - name: Run genesis sync
        id: sync
        env:
          GENESIS_LICENSE_KEY: ${{ secrets.GENESIS_LICENSE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          genesis sync --dir . --auto-apply --json $DRY_RUN_FLAG \
            | tee .genesis/last_sync_output.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Parse sync results
        id: parse
        run: |
          YELLOW=$(jq '.yellow_pending // 0' .genesis/last_sync_output.json)
          RED=$(jq '.red_blocked // 0' .genesis/last_sync_output.json)
          SCORE=$(jq '.score // "n/a"' .genesis/last_sync_output.json)
          GATE=$(jq -r '.gate_outcome // "unknown"' .genesis/last_sync_output.json)
          echo "yellow=$YELLOW" >> $GITHUB_OUTPUT
          echo "red=$RED" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "gate=$GATE" >> $GITHUB_OUTPUT

      - name: Commit .genesis/ updates (GREEN zone)
        if: ${{ inputs.dry_run != true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(genesis-sync): auto-apply GREEN zone updates [score=${{ steps.parse.outputs.score }}]"
          file_pattern: '.genesis/*.jsonl .genesis/*.json .genesis/*.md'
          commit_user_name: genesis-sync[bot]
          commit_user_email: genesis-sync@users.noreply.github.com

      - name: Open PR for YELLOW zone findings
        if: ${{ steps.parse.outputs.yellow > 0 && inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: genesis-sync/pending-${{ github.run_number }}
          title: "Genesis Sync: ${{ steps.parse.outputs.yellow }} pending finding(s) — score ${{ steps.parse.outputs.score }}"
          body: |
            ## Genesis Sync — Pending Findings

            Run: `${{ github.run_id }}` | Gate: `${{ steps.parse.outputs.gate }}` | Score: `${{ steps.parse.outputs.score }}`

            **${{ steps.parse.outputs.yellow }} yellow-zone finding(s)** require human review before auto-applying.

            See `.genesis/pending.json` for full details.

            ---
            *Generated by [genesis-sync](../.github/workflows/genesis-sync.yml) — autonomous maintenance loop*
          labels: genesis-sync,needs-review
          draft: false

      - name: Open issue for RED zone block
        if: ${{ steps.parse.outputs.red > 0 }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              const report = JSON.parse(fs.readFileSync('.genesis/last_sync_output.json', 'utf8'));
              findings = (report.findings || []).filter(f => f.zone === 'red');
            } catch(e) {}

            const body = [
              '## Genesis Sync — CRITICAL BLOCK',
              '',
              `Run: \`${context.runId}\` | Gate: \`${{ steps.parse.outputs.gate }}\``,
              '',
              '**RED-zone findings — human review required before any commit:**',
              '',
              ...findings.map(f => `- **${f.title}**: ${f.detail}`),
              '',
              'See `.genesis/last_sync_output.json` for full details.',
              '',
              '*Do NOT merge any PRs until this is resolved.*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Genesis Sync] CRITICAL: ${${{ steps.parse.outputs.red }}} red-zone finding(s)`,
              body,
              labels: ['genesis-sync', 'critical', 'needs-review'],
            });

      - name: Summary
        run: |
          echo "## Genesis Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Score | ${{ steps.parse.outputs.score }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | ${{ steps.parse.outputs.gate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Yellow (pending) | ${{ steps.parse.outputs.yellow }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Red (blocked) | ${{ steps.parse.outputs.red }} |" >> $GITHUB_STEP_SUMMARY
